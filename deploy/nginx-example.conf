# Example nginx site that puts HTTPS in front of the radar.
# Replace the domain and certificate paths (e.g. from certbot / Let's Encrypt).
server {
    listen 443 ssl http2;
    server_name radar.barrgazetas-toolkit.co.uk;

    ssl_certificate     /etc/letsencrypt/live/radar.barrgazetas-toolkit.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.barrgazetas-toolkit.co.uk/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
server {
    listen 80;
    server_name radar.barrgazetas-toolkit.co.uk;
    return 301 https://$host$request_uri;
}
